bank:
  datasource:
    cif:
      xa-class: oracle.jdbc.xa.client.OracleXADataSource
      url: ${CIF_DB_URL:jdbc:oracle:thin:@${bank.oracle.host}:${bank.oracle.port}:${bank.oracle.sid}}
      username: ${CIF_DB_USERNAME:SHFQ_CIF}
      password: ${CIF_DB_PASSWORD:}
      schema: ${CIF_DB_SCHEMA:SHFQ_CIF}
      min-pool-size: 1
      max-pool-size: 5
      borrow-timeout-seconds: 15
