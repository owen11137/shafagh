bank:
  datasource:
    base:
      xa-class: oracle.jdbc.xa.client.OracleXADataSource
      url: ${BASE_DB_URL:jdbc:oracle:thin:@${bank.oracle.host}:${bank.oracle.port}:${bank.oracle.sid}}
      username: ${BASE_DB_USERNAME:SHFQ_BASE}
      password: ${BASE_DB_PASSWORD:}
      schema: ${BASE_DB_SCHEMA:SHFQ_BASE}
      min-pool-size: 1
      max-pool-size: 5
      borrow-timeout-seconds: 15
