spring:
  application:
    name: shafagh
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]
      - classpath:bank/base.yml
      - classpath:bank/cif.yml
      - classpath:bank/dpst.yml
      - classpath:bank/loan.yml
      - classpath:bank/trx.yml
  jpa:
    open-in-view: false
bank:
  oracle:
    host: ${ORACLE_HOST:172.31.65.19}
    port: ${ORACLE_PORT:1521}
    sid: ${ORACLE_SID:centraldb}
  ddl-mode: validate
  dialect: org.hibernate.dialect.OracleDialect
